<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPGRADE asset matrix</title>
    <style>
      body { margin: 0; background: #14141c; color: #ddd; font: 13px ui-monospace, Menlo, monospace; }
      #bar { padding: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button { background: #262636; color: #ddd; border: 1px solid #444; padding: 5px 10px;
               font: 12px ui-monospace, Menlo, monospace; cursor: pointer; }
      button:hover { background: #34344a; }
      #status { color: #9c9; }
      h2 { font-size: 13px; font-weight: normal; color: #8a8a9c; margin: 18px 10px 6px; }
      canvas { image-rendering: pixelated; display: block; margin: 0 10px 20px; max-width: calc(100% - 20px); }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="dl-full">download full PNG</button>
      <button id="dl-compact">download compact PNG</button>
      <span id="status">building…</span>
    </div>
    <h2>full — every sampled asset at every tier</h2>
    <canvas id="full"></canvas>
    <h2>compact — one row per idea</h2>
    <canvas id="compact"></canvas>
    <script type="module" src="/src/assetspage.ts"></script>
  </body>
</html>
