<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPGRADE</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        display: grid;
        place-items: center;
      }
      #frame {
        position: relative;
        width: min(100vw, calc(100vh * 4 / 3));
        aspect-ratio: 4 / 3;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        width: 100%;
        height: 100%;
      }
      #crt {
        display: none;
      }
      /* CRT mode: unlocked by a hard-mode win, toggled with D. Pure overlay —
         the game still renders 256x192 underneath, untouched. */
      body.crt #frame {
        border-radius: 10px;
        overflow: hidden;
      }
      body.crt canvas {
        filter: blur(0.3px) saturate(1.2) contrast(1.05) brightness(1.05);
      }
      body.crt #crt {
        display: block;
        position: absolute;
        inset: 0;
        pointer-events: none;
        /* Scanlines sized in game rows (192) so they track the upscale factor,
           plus a vignette for the tube. */
        background-image:
          radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.35) 100%),
          linear-gradient(rgba(0, 0, 0, 0.25) 0 50%, transparent 50% 100%);
        background-size: 100% 100%, 100% calc(100% / 192);
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="game" width="256" height="192"></canvas>
      <div id="crt"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
